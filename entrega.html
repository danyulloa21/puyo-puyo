<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puyo Puyo Clone en JS</title>
    <style>
* { box-sizing: border-box; }

body {
    background: radial-gradient(circle at top, #3c2761, #17121f 70%);
    color: white;
    font-family: "Trebuchet MS", Arial, sans-serif;
    display: flex;
    justify-content: center;
    height: 100vh;
    min-height: 0;
    overflow: hidden;
    margin: 0;
    padding: 24px 12px;
    position: relative;
}

body::before, body::after {
    content: "";
    position: fixed;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(124, 77, 255, .12);
    filter: blur(8px);
    pointer-events: none;
}

body::before { top: 8%; left: -70px; }
body::after { right: -70px; bottom: 8%; background: rgba(0, 188, 212, .1); }

main { width: min(100%, 560px); max-height: 100vh; text-align: center; position: relative; z-index: 1; }
h1 { margin: 0 0 8px; color: #f7d85c; letter-spacing: 2px; text-shadow: 0 3px #000, 0 0 16px rgba(247, 216, 92, .35); }

.game-info {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 14px;
}

.game-info div, .next-piece {
    background: linear-gradient(145deg, #352c48, #211c2c);
    border: 1px solid #756392;
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
}

.game-info strong { color: #f7d85c; display: block; font-size: 18px; margin-top: 2px; }

.game-layout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
}

#game-container { position: relative; width: 360px; max-width: 100%; margin: auto; }

canvas {
    border: 4px solid #f5f0ff;
    border-radius: 8px;
    background-color: #100d18;
    background-image: linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 60px 60px;
    box-shadow: 0 0 0 2px #5b477a, 0 12px 30px rgba(0,0,0,.45);
    display: block;
    max-width: 100%;
}

.overlay {
    position: absolute;
    inset: 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background: rgba(13, 9, 22, .88);
    z-index: 2;
}

.overlay.hidden { display: none; }
.overlay h2 { margin: 0 0 8px; font-size: 30px; }
.overlay p { color: #ddd; line-height: 1.4; }

#combo-message {
    position: absolute;
    left: 0;
    right: 0;
    top: 42%;
    color: #ffe66d;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 3px #3a1d58, 0 0 16px #ff8c00;
    transform: scale(.7);
    z-index: 3;
}

#combo-message.show { animation: combo-pop .75s ease-out; }

@keyframes combo-pop {
    0% { opacity: 0; transform: scale(.7) translateY(12px); }
    25% { opacity: 1; transform: scale(1.15) translateY(0); }
    100% { opacity: 0; transform: scale(1) translateY(-30px); }
}

button {
    border: 0;
    border-radius: 6px;
    background: linear-gradient(180deg, #9b78ff, #6840d7);
    color: white;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    padding: 10px 18px;
    box-shadow: 0 4px 0 #42238d, 0 7px 12px rgba(0,0,0,.25);
    transition: transform .12s ease, filter .12s ease;
}

button:hover { filter: brightness(1.15); transform: translateY(-1px); }
button:active { transform: translateY(2px); box-shadow: 0 2px 0 #42238d; }
button:disabled { cursor: not-allowed; opacity: .45; }

.side-panel {
    width: 160px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
}

.next-piece { margin: 0; width: 100%; }
.next-piece span { display: block; font-size: 14px; margin-bottom: 4px; }
#nextCanvas { border: 0; border-radius: 0; background: transparent; box-shadow: none; margin: auto; }

.controls { display: flex; flex-direction: column; gap: 8px; }
.controls button:last-child { background: #d64545; }
.instructions { color: #bbb; font-size: 14px; margin: 6px 0 0; }
.side-tip { color: #aaa; font-size: 12px; line-height: 1.35; margin: 0; }

@media (max-height: 850px) {
    body { padding: 4px 12px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .game-info { font-size: 12px; }
    .next-piece { margin: 0; padding: 4px; }
    .controls button { padding: 7px 14px; }
}

@media (max-width: 570px) {
    .game-layout { flex-direction: column; align-items: center; }
    .side-panel { width: min(360px, 100%); flex-direction: row; align-items: center; }
    .next-piece { flex: 1; }
    .controls { flex-direction: row; flex: 1; }
    .controls button { flex: 1; }
    .side-tip { display: none; }
}

@media (max-width: 430px) {
    .game-layout { flex-direction: column; gap: 6px; }
    .side-panel { width: 100%; }
    .side-tip { display: none; }
}


    </style>
</head>
<body>
    <main>
        <h1>Puyo Puyo</h1>
        <section class="game-info">
            <div>PuntuaciÃ³n: <strong id="score-val">0</strong></div>
            <div>Nivel: <strong id="level-val">1</strong></div>
            <div>RÃ©cord: <strong id="high-score-val">0</strong></div>
        </section>

        <div class="game-layout">
            <div id="game-container">
                <canvas id="gameCanvas" width="360" height="720"></canvas>
                <div id="combo-message" aria-live="polite"></div>
                <div id="overlay" class="overlay">
                    <h2 id="overlay-title">Puyo Puyo</h2>
                    <p id="overlay-message">Forma grupos de cuatro o mÃ¡s Puyos iguales.</p>
                    <button id="start-button">Comenzar</button>
                </div>
            </div>

            <aside class="side-panel">
                <section class="next-piece">
                    <span>Siguiente pieza</span>
                    <canvas id="nextCanvas" width="180" height="60"></canvas>
                </section>
                <div class="controls">
                    <button id="pause-button" disabled>Pausar</button>
                    <button id="restart-button">Reiniciar</button>
                </div>
                <p class="side-tip">La sombra muestra dÃ³nde caerÃ¡ la pieza.</p>
            </aside>
        </div>

        <p class="instructions">â† â†’ mover Â· â†‘ rotar Â· â†“ bajar Â· P pausar</p>
    </main>
    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('nextCanvas');
const nextCtx = nextCanvas.getContext('2d');
const scoreVal = document.getElementById('score-val');
const levelVal = document.getElementById('level-val');
const highScoreVal = document.getElementById('high-score-val');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayMessage = document.getElementById('overlay-message');
const startButton = document.getElementById('start-button');
const pauseButton = document.getElementById('pause-button');
const restartButton = document.getElementById('restart-button');
const comboMessage = document.getElementById('combo-message');

const ROWS = 12;
const COLS = 6;
const SIZE = 60;
const PUYO_COLORS = ['#ff3333', '#33cc33', '#3333ff', '#ffff33'];
const HIGH_SCORE_KEY = 'puyo-puyo-high-score';

function fitBoardToScreen() {
    const availableHeight = window.innerHeight - 170;
    const availableWidth = Math.min(window.innerWidth - 24, 360);
    const displayWidth = Math.max(180, Math.min(availableWidth, availableHeight / 2));
    canvas.style.width = `${displayWidth}px`;
    canvas.style.height = `${displayWidth * 2}px`;
}

const PUYO_IMAGES = PUYO_COLORS.map((color) => {
    const image = new Image();
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60">
        <defs><radialGradient id="shine" cx="35%" cy="25%">
            <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
            <stop offset=".25" stop-color="${color}"/>
            <stop offset="1" stop-color="#000" stop-opacity=".25"/>
        </radialGradient></defs>
        <circle cx="30" cy="30" r="25" fill="url(#shine)" stroke="#000" stroke-width="2">
            <animate attributeName="r" values="24;27;24" dur=".8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="21" cy="18" r="5" fill="#fff" opacity=".7">
            <animate attributeName="opacity" values=".35;.9;.35" dur=".8s" repeatCount="indefinite"/>
        </circle></svg>`;
    image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    return image;
});

let board;
let currentPiece;
let nextColors;
let score = 0;
let level = 1;
let gameOver = false;
let gameStarted = false;
let paused = false;
let locking = false;
let comboChain = 0;
let gravityTimer;

function randomColor() {
    return Math.floor(Math.random() * 4) + 1;
}

function randomColors() {
    return [randomColor(), randomColor(), randomColor()];
}

function createPiece(colors) {
    return {
        p1: { x: 2, y: 1, color: colors[0] },
        p2: { x: 2, y: 0, color: colors[1] },
        p3: { x: 3, y: 1, color: colors[2] },
        rotation: 0
    };
}

function resetGame() {
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    score = 0;
    level = 1;
    gameOver = false;
    paused = false;
    locking = false;
    comboChain = 0;
    nextColors = randomColors();
    scoreVal.textContent = score;
    levelVal.textContent = level;
    currentPiece = null;
    updateHighScore();
    drawNextPiece();
}

function startGame() {
    resetGame();
    gameStarted = true;
    spawnPiece();
    overlay.classList.add('hidden');
    pauseButton.disabled = false;
    pauseButton.textContent = 'Pausar';
    startGravity();
    draw();
}

function showOverlay(title, message, buttonText) {
    overlayTitle.textContent = title;
    overlayMessage.textContent = message;
    startButton.textContent = buttonText;
    overlay.classList.remove('hidden');
}

function endGame() {
    gameOver = true;
    gameStarted = false;
    clearInterval(gravityTimer);
    updateHighScore();
    pauseButton.disabled = true;
    showOverlay('Game Over', `PuntuaciÃ³n final: ${score}`, 'Jugar otra vez');
    draw();
}

function togglePause() {
    if (!gameStarted || gameOver) return;
    paused = !paused;
    pauseButton.textContent = paused ? 'Continuar' : 'Pausar';
    if (paused) {
        showOverlay('Pausa', 'El juego estÃ¡ pausado.', 'Continuar');
    } else {
        overlay.classList.add('hidden');
    }
}

function startGravity() {
    clearInterval(gravityTimer);
    const speed = Math.max(150, 1000 - (level - 1) * 100);
    gravityTimer = setInterval(() => {
        if (gameStarted && !paused && !gameOver) {
            drop();
            draw();
        }
    }, speed);
}

function spawnPiece() {
    currentPiece = createPiece(nextColors);
    nextColors = randomColors();
    drawNextPiece();
    if (!isValid(currentPiece.p1.x, currentPiece.p1.y) ||
        !isValid(currentPiece.p2.x, currentPiece.p2.y) ||
        !isValid(currentPiece.p3.x, currentPiece.p3.y)) {
        endGame();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (board[r][c] !== 0) drawPuyo(ctx, c, r, board[r][c]);
        }
    }
    if (currentPiece && !gameOver) {
        drawGhostPiece();
        [currentPiece.p1, currentPiece.p2, currentPiece.p3].forEach((puyo) => {
            if (puyo.y >= 0) drawPuyo(ctx, puyo.x, puyo.y, puyo.color);
        });
    }
}

function drawGrid() {
    ctx.save();
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,.025)' : 'rgba(0,0,0,.08)';
            ctx.fillRect(c * SIZE, r * SIZE, SIZE, SIZE);
            ctx.strokeStyle = 'rgba(210,190,255,.16)';
            ctx.lineWidth = 1;
            ctx.strokeRect(c * SIZE + .5, r * SIZE + .5, SIZE - 1, SIZE - 1);
        }
    }
    ctx.restore();
}

function getDropDistance() {
    if (!currentPiece) return 0;
    const pieces = [currentPiece.p1, currentPiece.p2, currentPiece.p3];
    let distance = 0;
    while (pieces.every((puyo) => isValid(puyo.x, puyo.y + distance + 1))) {
        distance++;
    }
    return distance;
}

function drawGhostPiece() {
    const distance = getDropDistance();
    if (distance === 0) return;

    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#f7d85c';
    ctx.shadowColor = '#f7d85c';
    ctx.shadowBlur = 8;

    [currentPiece.p1, currentPiece.p2, currentPiece.p3].forEach((puyo) => {
        const x = puyo.x * SIZE + SIZE / 2;
        const y = (puyo.y + distance) * SIZE + SIZE / 2;
        ctx.beginPath();
        ctx.arc(x, y, SIZE / 2 - 7, 0, Math.PI * 2);
        ctx.stroke();
    });
    ctx.restore();
}

function drawPuyo(context, x, y, colorIndex) {
    const image = PUYO_IMAGES[colorIndex - 1];
    if (image.complete) context.drawImage(image, x * SIZE, y * SIZE, SIZE, SIZE);
}

function drawNextPiece() {
    nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextColors) return;
    nextColors.forEach((color, index) => drawPuyo(nextCtx, index, 0, color));
}

function move(dir) {
    if (!currentPiece || paused || gameOver) return;
    const pieces = [currentPiece.p1, currentPiece.p2, currentPiece.p3];
    if (pieces.every((puyo) => isValid(puyo.x + dir, puyo.y))) {
        pieces.forEach((puyo) => { puyo.x += dir; });
    }
}

function isValid(x, y) {
    if (y < 0) return x >= 0 && x < COLS;
    return x >= 0 && x < COLS && y < ROWS && board[y][x] === 0;
}

function rotate() {
    if (!currentPiece || paused || gameOver) return;
    const nextRot = (currentPiece.rotation + 1) % 4;
    let p2x = currentPiece.p1.x;
    let p2y = currentPiece.p1.y;
    let p3x = currentPiece.p1.x;
    let p3y = currentPiece.p1.y;

    if (nextRot === 0) { p2y--; p3x++; }
    if (nextRot === 1) { p2x++; p3y++; }
    if (nextRot === 2) { p2y++; p3x--; }
    if (nextRot === 3) { p2x--; p3y--; }

    if (isValid(p2x, p2y) && isValid(p3x, p3y)) {
        currentPiece.p2.x = p2x;
        currentPiece.p2.y = p2y;
        currentPiece.p3.x = p3x;
        currentPiece.p3.y = p3y;
        currentPiece.rotation = nextRot;
    }
}

function drop() {
    if (!currentPiece || paused || gameOver || locking) return;
    const pieces = [currentPiece.p1, currentPiece.p2, currentPiece.p3];
    if (pieces.every((puyo) => isValid(puyo.x, puyo.y + 1))) {
        pieces.forEach((puyo) => { puyo.y++; });
    } else {
        lockPiece();
    }
}

function lockPiece() {
    locking = true;
    comboChain = 0;
    [currentPiece.p1, currentPiece.p2, currentPiece.p3].forEach((puyo) => {
        if (puyo.y >= 0) board[puyo.y][puyo.x] = puyo.color;
    });
    applyGravity().then(checkMatches);
}

function applyGravity() {
    return new Promise((resolve) => {
        let moved = false;
        for (let c = 0; c < COLS; c++) {
            for (let r = ROWS - 2; r >= 0; r--) {
                if (board[r][c] !== 0 && board[r + 1][c] === 0) {
                    let currentRow = r;
                    while (currentRow < ROWS - 1 && board[currentRow + 1][c] === 0) {
                        board[currentRow + 1][c] = board[currentRow][c];
                        board[currentRow][c] = 0;
                        currentRow++;
                        moved = true;
                    }
                }
            }
        }
        if (moved) {
            draw();
            setTimeout(() => resolve(applyGravity()), 100);
        } else {
            resolve();
        }
    });
}

function checkMatches() {
    const visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
    let elementsToRemove = [];
    let matchFound = false;

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (board[r][c] !== 0 && !visited[r][c]) {
                const cluster = [];
                dfs(r, c, board[r][c], cluster, visited);
                if (cluster.length >= 4) {
                    elementsToRemove = elementsToRemove.concat(cluster);
                    matchFound = true;
                    score += cluster.length * 10 * level * Math.max(1, comboChain + 1);
                }
            }
        }
    }

    if (matchFound) {
        comboChain++;
        showCombo(comboChain);
        elementsToRemove.forEach(([r, c]) => { board[r][c] = 0; });
        updateScore();
        draw();
        setTimeout(() => applyGravity().then(checkMatches), 200);
    } else {
        comboChain = 0;
        locking = false;
        spawnPiece();
        draw();
    }
}

function showCombo(chain) {
    comboMessage.textContent = chain > 1 ? `Â¡Combo x${chain}!` : 'Â¡Buena combinaciÃ³n!';
    comboMessage.classList.remove('show');
    void comboMessage.offsetWidth;
    comboMessage.classList.add('show');
}

function dfs(r, c, color, cluster, visited) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
    if (visited[r][c] || board[r][c] !== color) return;
    visited[r][c] = true;
    cluster.push([r, c]);
    dfs(r + 1, c, color, cluster, visited);
    dfs(r - 1, c, color, cluster, visited);
    dfs(r, c + 1, color, cluster, visited);
    dfs(r, c - 1, color, cluster, visited);
}

function updateScore() {
    scoreVal.textContent = score;
    const newLevel = Math.floor(score / 100) + 1;
    if (newLevel !== level) {
        level = newLevel;
        levelVal.textContent = level;
        startGravity();
    }
    updateHighScore();
}

function updateHighScore() {
    const highScore = Math.max(score, Number(localStorage.getItem(HIGH_SCORE_KEY) || 0));
    if (score >= highScore) localStorage.setItem(HIGH_SCORE_KEY, String(score));
    highScoreVal.textContent = highScore;
}

window.addEventListener('keydown', (event) => {
    if (event.key.toLowerCase() === 'p') togglePause();
    if (!gameStarted || paused || gameOver) return;
    if (event.key === 'ArrowLeft') move(-1);
    if (event.key === 'ArrowRight') move(1);
    if (event.key === 'ArrowUp') rotate();
    if (event.key === 'ArrowDown') drop();
    if (event.key.startsWith('Arrow')) event.preventDefault();
    draw();
});

window.addEventListener('resize', fitBoardToScreen);

startButton.addEventListener('click', () => {
    if (paused) {
        togglePause();
    } else {
        startGame();
    }
});

pauseButton.addEventListener('click', togglePause);
restartButton.addEventListener('click', startGame);

resetGame();
fitBoardToScreen();
showOverlay('Puyo Puyo', 'Forma grupos de cuatro o mÃ¡s Puyos iguales.', 'Comenzar');
draw();
setInterval(() => { draw(); drawNextPiece(); }, 50);


    </script>
</body>
